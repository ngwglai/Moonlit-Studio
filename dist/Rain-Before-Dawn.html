 constructor(root,project,options={}){this.root=root;this.p=C.clone(project);if(/^#[0-9a-f]{6}$/i.test(this.p.settings.accent))this.root.style.setProperty('--accent',this.p.settings.accent);this.e=new C.Engine(this.p);this.options=options;this.prefix='moonlit.game.'+this.p.id;this.disposed=false;this.timer=0;this.textTimer=0;this.modeTimer=0;this.audio={};this.auto=false;this.skip=false;this.modal=false;this.started=false;this.hidden=false;this.seen=new Set(this.read('seen',[]));this.unlocked=new Set(this.read('gallery',[]));this.endings=new Set(this.read('endings',[]));this.prefs={speed:this.p.settings.textSpeed??32,autoDelay:this.p.settings.autoDelay||1800,volume:70,voice:90,...this.read('prefs',{})};
 this.click=e=>{const b=e.target.closest('[data-game]');if(b){e.stopPropagation();this.action(b.dataset.game);}else if(e.target.closest('.vn-stage')&&!e.target.closest('.vn-choices')&&!this.modal)this.next();};this.key=e=>{if(this.modal){if(e.key==='Escape'){e.preventDefault();this.dismiss();}else if(e.key==='Tab'){const focus=[...this.root.querySelectorAll('.vn-panel button,.vn-panel input,.vn-panel select,.vn-panel textarea')].filter(x=>!x.disabled);if(focus.length){const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||(e.target.closest('button')&&[' ','Enter'].includes(e.key)))return;if([' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();this.next();}if(e.key==='ArrowLeft'){e.preventDefault();this.back();}if(e.key==='Escape')this.openMenu();if(e.key.toLowerCase()==='h')this.action('hide');};this.root.addEventListener('click',this.click);document.addEventListener('keydown',this.key);this.title();}
 read(key,fallback){try{return JSON.parse(localStorage.getItem(this.prefix+'.'+key))??fallback;}catch{return fallback;}}
 write(key,value){try{localStorage.setItem(this.prefix+'.'+key,JSON.stringify(value));return true;}catch{return false;}}
 stopTimers(){clearTimeout(this.timer);clearTimeout(this.modeTimer);clearInterval(this.textTimer);this.revealing=false;}
 stopAudio(){Object.values(this.audio).forEach(a=>a.pause());this.audio={};}
 title(){this.stopTimers();this.stopAudio();this.started=false;this.pendingWait=false;this.auto=this.skip=false;this.modal=false;this.root.innerHTML=`<div class="vn-shell"><div class="vn-title"><div class="vn-title-grain"></div><div class="vn-title-content"><span class="eyebrow">A VISUAL NOVEL</span><h1>${esc(this.p.title)}</h1><p>${esc(this.p.description||'每一个选择，都会通向不同的故事。')}</p><div class="vn-title-actions">${button('开始故事','start','primary')}${button('读取存档','load')}${button('回忆画廊','gallery')}${button('游戏设置','settings')}${this.options.onClose?button('返回编辑器','close'):''}</div><small>${esc(this.p.author||'独立创作')} · Powered by Moonlit</small></div><div class="vn-title-orbit"><span>月</span><small>MOONLIT</small></div></div><div class="vn-overlay-slot"></div></div>`;}
 start(scene){this.stopTimers();this.stopAudio();this.e.reset(scene);this.pendingWait=false;this.lastBackgroundKey='';this.started=true;this.modal=false;this.auto=this.skip=false;this.next(true);}
 next(force=false){if(!this.started)return;if(this.revealing&&!force){this.reveal();return;}if(this.e.state.choice||this.e.state.ended)return;if(this.hidden){this.hidden=false;this.root.querySelector('.vn-dialogue')?.classList.remove('is-hidden');return;}if(this.e.current?.type==='video'&&!force)return;this.stopTimers();try{this.e.advance();this.render();this.processEvents();}catch(err){this.error(err);}}
 reveal(){clearInterval(this.textTimer);const el=this.root.querySelector('.vn-text');if(el)el.textContent=this.e.state.dialogue?.text||'';this.revealing=false;this.schedule();}
 render(){this.stopTimers();this.audio.voice?.pause();const s=this.e.state;this.root.innerHTML=`<div class="vn-shell">${stageHTML(this.p,s)}<div class="vn-controls"><div>${button('◀ 回退','back')}${button('历史','history')}${button('隐藏界面','hide')}</div><div>${button('自动','auto',this.auto?'active':'')}${button('快进','skip',this.skip?'active':'')}${button('保存','save')}${button('读取','load')}${button('菜单','menu')}${this.options.onClose?button('退出试玩','close'):''}</div></div><div class="vn-overlay-slot"></div></div>`;
 const bgKey=JSON.stringify(s.background);if(bgKey===this.lastBackgroundKey)this.root.querySelector('.vn-background')?.classList.remove('fade-in');this.lastBackgroundKey=bgKey;this.hidden=false;this.syncMusic();if(s.ended){if(this.e.current?.id){this.endings.add(this.e.current.id);this.write('endings',[...this.endings]);}this.auto=this.skip=false;return;}if(s.dialogue){const d=s.dialogue;this.currentWasSeen=this.seen.has(d.id);this.seen.add(d.id);this.write('seen',[...this.seen]);if(d.voice)this.play('voice',d.voice,this.prefs.voice,false);else this.audio.voice?.pause();if(!this.skip&&this.prefs.speed>0){const target=this.root.querySelector('.vn-text');const chars=Array.from(d.text);let i=0;target.textContent='';this.revealing=true;this.textTimer=setInterval(()=>{if(!target.isConnected){clearInterval(this.textTimer);return;}target.textContent+=chars[i++]||'';if(i>=chars.length){this.reveal();}},1000/Math.max(1,this.prefs.speed));}else this.schedule();}else this.schedule();
 if(!s.choice&&!['wait','video'].includes(this.e.current?.type))this.write('auto',this.e.save());}
 schedule(){clearTimeout(this.modeTimer);if(this.modal||this.revealing||!this.started||this.e.state.choice||this.e.state.ended||['wait','video'].includes(this.e.current?.type))return;if(this.skip){if(!this.currentWasSeen&&!this.p.settings.skipUnread){this.skip=false;this.root.querySelector('[data-game="skip"]')?.classList.remove('active');return;}this.modeTimer=setTimeout(()=>this.next(),80);}else if(this.auto){this.modeTimer=setTimeout(()=>{if(this.audio.voice&&!this.audio.voice.paused&&!this.audio.voice.ended){this.schedule();return;}this.next();},Math.max(500,this.prefs.autoDelay));}}
 processEvents(){for(const ev of this.e.events){if(ev.type==='unlock'){const a=this.p.assets.find(a=>a.id===ev.asset);if(a?.gallery){this.unlocked.add(ev.asset);this.write('gallery',[...this.unlocked]);}}if(ev.type==='sound')this.play('sound',ev.asset,ev.volume??80,false);if(ev.type==='wait')this.timer=setTimeout(()=>{if(this.modal){this.pendingWait=true;return;}this.next(true);},Math.max(0,Math.min(60000,Number(ev.duration)||0)));if(ev.type==='effect'){const stage=this.root.querySelector('.vn-stage');if(stage){stage.classList.add('effect-'+ev.effect);stage.style.animationDuration=Math.max(100,Number(ev.duration)||600)+'ms';}}if(ev.type==='video')this.playVideo(ev);}}
 play(channel,id,volume=70,loop=false){this.audio[channel]?.pause();const src=safeAsset(this.p,id);if(!src){delete this.audio[channel];return;}const a=new Audio(src);a.volume=Math.max(0,Math.min(1,volume/100*this.prefs.volume/100));a.loop=loop;this.audio[channel]=a;a.play().catch(()=>{});return a;}
 syncMusic(){const m=this.e.state.music;if(!m){this.audio.music?.pause();delete this.audio.music;this.musicId='';return;}if(this.musicId!==m.asset||!this.audio.music||this.musicLoop!==m.loop){this.musicLoop=m.loop;this.musicId=m.asset;this.play('music',m.asset,m.volume??60,m.loop!==false);}else this.audio.music.volume=Math.max(0,Math.min(1,(m.volume??60)/100*this.prefs.volume/100));}
 playVideo(n){const src=safeAsset(this.p,n.asset);if(!src){this.timer=setTimeout(()=>this.next(true),0);return;}const holder=document.createElement('div');holder.className='vn-video';holder.innerHTML=`<video autoplay controls playsinline src="${esc(src)}"></video><button data-game="video-end">跳过视频</button>`;this.root.querySelector('.vn-stage').append(holder);const v=holder.querySelector('video');v.volume=this.prefs.volume/100;v.onended=()=>this.next(true);v.onerror=()=>this.next(true);v.play().catch(()=>{});}
 back(){if(!this.started)return;this.stopTimers();this.audio.voice?.pause();this.pendingWait=false;this.auto=this.skip=false;if(this.e.rollback()){this.modal=false;this.musicId='';this.render();this.reveal();if(['wait','video'].includes(this.e.current?.type)){this.e.events=[this.e.current];this.processEvents();}}}
 action(a){if(a.startsWith('choose:')){this.stopTimers();try{this.e.choose(Number(a.split(':')[1]));this.render();this.processEvents();}catch(err){this.error(err);}return;}if(a.startsWith('slot-save:')){this.saveSlot(a.split(':')[1]);return;}if(a.startsWith('slot-load:')){this.loadSlot(a.split(':')[1]);return;}if(a.startsWith('slot-delete:')){if(confirm('删除这个存档？')){this.write('slot'+a.split(':')[1],null);this.slots('load');}return;}if(a.startsWith('gallery:')){const asset=this.p.assets.find(x=>x.id===a.slice(8));if(asset&&this.unlocked.has(asset.id))this.overlay(asset.name,`<img class="gallery-full" alt="${esc(asset.name)}" src="${esc(safeAsset(this.p,asset.id))}">`);return;}
 switch(a){case'start':this.start();break;case'close':this.dispose();this.options.onClose?.();break;case'title':this.title();break;case'back':this.back();break;case'auto':this.auto=!this.auto;this.skip=false;this.root.querySelector('[data-game="auto"]')?.classList.toggle('active',this.auto);this.root.querySelector('[data-game="skip"]')?.classList.remove('active');this.schedule();break;case'skip':this.skip=!this.skip;this.auto=false;this.root.querySelector('[data-game="skip"]')?.classList.toggle('active',this.skip);this.root.querySelector('[data-game="auto"]')?.classList.remove('active');if(this.revealing)this.reveal();else this.schedule();break;case'hide':this.hidden=!this.hidden;this.root.querySelector('.vn-dialogue')?.classList.toggle('is-hidden',this.hidden);break;case'history':this.history();break;case'save':if(this.started)this.slots('save');break;case'load':this.slots('load');break;case'menu':this.openMenu();break;case'settings':this.settings();break;case'gallery':this.gallery();break;case'dismiss':this.dismiss();break;case'video-end':this.next(true);break;case'export-save':download(safeName(this.p.title)+'-存档.json',JSON.stringify(this.e.save()));break;case'import-save':this.importSave();break;}}
 overlay(title,content){this.modal=true;clearTimeout(this.modeTimer);clearInterval(this.textTimer);if(this.revealing){const t=this.root.querySelector('.vn-text');if(t)t.textContent=this.e.state.dialogue?.text||'';this.revealing=false;}this.audio.voice?.pause();this.root.querySelector('video')?.pause();const slot=this.root.querySelector('.vn-overlay-slot');slot.innerHTML=`<div class="vn-overlay"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="vn-panel"><header><h2>${esc(title)}</h2>${button('关闭 ×','dismiss')}</header><div class="vn-panel-content">${content}</div></section></div>`;slot.querySelector('button')?.focus();}
 dismiss(){this.modal=false;const slot=this.root.querySelector('.vn-overlay-slot');if(slot)slot.innerHTML='';if(this.pendingWait){this.pendingWait=false;this.next(true);}else if(this.e.current?.type==='wait'&&this.started){clearTimeout(this.timer);this.timer=setTimeout(()=>this.next(true),100);}this.root.querySelector('video')?.play().catch(()=>{});this.schedule();}
 openMenu(){this.overlay('暂停',`<div class="menu-list">${button('继续阅读','dismiss')}${button('保存进度','save')}${button('读取进度','load')}${button('阅读设置','settings')}${button('回忆画廊','gallery')}${button('返回标题','title')}${this.options.onClose?button('返回编辑器','close'):''}</div><p class="muted">空格 / 回车：继续 · ←：回退 · H：隐藏对话 · Esc：菜单</p>`);}
 history(){this.overlay('阅读历史',`<div class="backlog">${this.e.backlog.length?this.e.backlog.map(d=>`<article><strong>${esc(d.name||'旁白')}</strong><p>${esc(d.text)}</p>${d.voice?`<audio controls src="${esc(safeAsset(this.p,d.voice))}"></audio>`:''}</article>`).join(''):'还没有阅读记录。'}</div>`);const b=this.root.querySelector('.vn-panel-content');b.scrollTop=b.scrollHeight;}
 slots(mode){const auto=this.read('auto',null);this.overlay(mode==='save'?'保存进度':'读取进度',`<p class="muted">存档保存在当前浏览器；也可以导出为文件，在另一台电脑导入。</p><div class="slot-grid">${Array.from({length:12},(_,i)=>{const s=this.read('slot'+i,null);return `<article class="save-slot"><span>SLOT ${String(i+1).padStart(2,'0')}</span><strong>${s?esc(s.snapshot.state.dialogue?.name||this.p.scenes.find(x=>x.id===s.snapshot.state.scene)?.name||'剧情进度'):'空存档'}</strong><p>${s?esc((s.snapshot.state.dialogue?.text||'').slice(0,50)): '尚未保存'}</p><small>${s?new Date(s.time).toLocaleString():'—'}</small><div>${button(mode==='save'?'保存到这里':'读取',`slot-${mode}:${i}`)}${s?button('删除',`slot-delete:${i}`):''}</div></article>`;}).join('')}</div><div class="row">${auto&&mode==='load'?button('读取自动存档','slot-load:auto'):''}${this.started?button('导出当前进度','export-save'):''}${button('导入存档文件','import-save')}</div>`);}
 saveSlot(id){if(!this.started)return;if(this.read('slot'+id,null)&&!confirm('覆盖这个存档？'))return;if(!this.write('slot'+id,this.e.save())){alert('浏览器无法保存，请使用“导出当前进度”保存文件。');return;}this.slots('save');}
 loadSlot(id){const s=this.read(id==='auto'?'auto':'slot'+id,null);if(!s){alert('这个位置还没有存档。');return;}try{this.e.load(s);this.stopTimers();this.stopAudio();this.started=true;this.auto=this.skip=this.modal=false;this.pendingWait=false;this.render();if(this.e.current&&['wait','video'].includes(this.e.current.type)){this.e.events=[this.e.current];this.processEvents();}}catch(err){alert(err.message);}}
 importSave(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());this.e.load(data);this.started=true;this.modal=false;this.pendingWait=false;this.auto=this.skip=false;this.stopAudio();this.render();if(this.e.current&&['wait','video'].includes(this.e.current.type)){this.e.events=[this.e.current];this.processEvents();}}catch(e){alert('无法读取存档：'+e.message);}};input.click();}
 settings(){this.overlay('阅读设置',`<div class="settings-form"><label>文字速度（0 为瞬间显示）<input id="game-speed" type="range" min="0" max="100" value="${this.prefs.speed}"><output>${this.prefs.speed} 字/秒</output></label><label>自动阅读间隔<input id="game-delay" type="range" min="500" max="6000" step="100" value="${this.prefs.autoDelay}"><output>${this.prefs.autoDelay} 毫秒</output></label><label>总音量<input id="game-volume" type="range" min="0" max="100" value="${this.prefs.volume}"><output>${this.prefs.volume}%</output></label><label>语音音量<input id="game-voice" type="range" min="0" max="100" value="${this.prefs.voice}"><output>${this.prefs.voice}%</output></label></div>`);for(const [id,key,suffix]of[['speed','speed',' 字/秒'],['delay','autoDelay',' 毫秒'],['volume','volume','%'],['voice','voice','%']]){this.root.querySelector('#game-'+id).oninput=e=>{this.prefs[key]=Number(e.target.value);e.target.nextElementSibling.textContent=e.target.value+suffix;this.write('prefs',this.prefs);if(this.audio.music)this.audio.music.volume=Math.max(0,Math.min(1,(this.e.state.music?.volume??60)/100*this.prefs.volume/100));};}}
 gallery(){const assets=this.p.assets.filter(a=>a.gallery);const ends=this.p.scenes.flatMap(s=>s.nodes).filter(n=>n.type==='end');this.overlay('回忆画廊',`<h3>场景回忆 ${assets.filter(a=>this.unlocked.has(a.id)).length} / ${assets.length}</h3><div class="gallery-grid">${assets.map(a=>this.unlocked.has(a.id)?`<button data-game="gallery:${esc(a.id)}"><img alt="${esc(a.name)}" src="${esc(safeAsset(this.p,a.id))}"><span>${esc(a.name)}</span></button>`:'<div class="gallery-locked">尚未解锁</div>').join('')||'<p class="muted">这个作品没有设置回忆图片。</p>'}</div><h3>结局收集 ${ends.filter(n=>this.endings.has(n.id)).length} / ${ends.length}</h3><div class="ending-list">${ends.map(n=>`<div>${this.endings.has(n.id)?'✦ '+esc(n.title):'◇ 尚未解锁'}</div>`).join('')}</div>`);}
 error(err){this.stopTimers();this.auto=this.skip=false;this.overlay('剧情运行中断',`<p>${esc(err.message)}</p><p class="muted">场景：${esc(this.p.scenes.find(s=>s.id===this.e.state.scene)?.name)} · 指令 ${this.e.state.index}</p>${button('返回标题','title')}`);}
 dispose(){this.disposed=true;this.stopTimers();this.stopAudio();this.root.querySelector('video')?.pause();this.root.removeEventListener('click',this.click);document.removeEventListener('keydown',this.key);this.root.innerHTML='';}
}
global.GalRuntime={Player,stageHTML,esc,download,safeName,safeAsset};
})(window);

new GalRuntime.Player(document.getElementById("game"),JSON.parse(document.getElementById("project-data").textContent));</script></body></html>
