 constructor(){this.p=C.demo();this.sceneId=this.p.startScene;this.nodeId=this.p.scenes[0].nodes[1].id;this.view='script';this.selected=new Set([this.nodeId]);this.undoStack=[];this.redoStack=[];this.saved=false;this.saving=false;this.store=new ProjectStore();this.search='';this.clipboard=[];this.lastUndo=0;this.saveTimer=0;this.player=null;this.activeChar=null;this.activeAsset=null;this.assetFilter='all';this.modalReturn=null;this.bind();this.render();this.init();}
 async init(){try{await this.store.open();const list=await this.store.list();if(list.length){this.p=C.normalize(list[0]);this.sceneId=this.p.startScene;this.nodeId=this.scene()?.nodes[0]?.id;this.selected=new Set(this.nodeId?[this.nodeId]:[]);}else await this.store.save(this.p);this.saved=true;this.render();}catch(err){this.toast('自动保存未启用：'+err.message+'。请用“备份项目”保存文件。','error');this.status('未启用自动保存');}}
 scene(){return this.p.scenes.find(s=>s.id===this.sceneId)||this.p.scenes[0];}
 node(){return this.scene()?.nodes.find(n=>n.id===this.nodeId);}
 bind(){document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)this.action(el.dataset.action,e);});document.addEventListener('change',e=>{if(e.target.matches('[data-field]'))this.changeField(e.target);});document.addEventListener('input',e=>{if(e.target.id==='global-search'){this.search=e.target.value;this.renderScript();}if(e.target.matches('[data-live]')){const key=e.target.dataset.live;const n=this.node();if(n){this.checkpoint('live:'+n.id+':'+key);n[key]=e.target.value;this.changed(false);this.renderStage();this.updateNodeCard(n);}}});document.addEventListener('keydown',e=>this.key(e));document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-node]');if(card){this.dragNode=card.dataset.node;e.dataTransfer.setData('text/plain',this.dragNode);e.dataTransfer.effectAllowed='move';}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-node]'))e.preventDefault();});document.addEventListener('drop',e=>{const card=e.target.closest('[data-node]');if(card&&this.dragNode){e.preventDefault();const a=this.scene().nodes.findIndex(n=>n.id===this.dragNode),b=this.scene().nodes.findIndex(n=>n.id===card.dataset.node);this.dragNode=null;if(a>=0&&b>=0&&a!==b){this.checkpoint();const [n]=this.scene().nodes.splice(a,1);this.scene().nodes.splice(b,0,n);this.changed();}}});window.addEventListener('beforeunload',e=>{if(!this.saved){e.preventDefault();e.returnValue='';}});window.addEventListener('pagehide',()=>{if(!this.saved)this.persist();});document.addEventListener('pointerdown',e=>this.dragActor(e));}
 checkpoint(key=''){const now=Date.now();if(key&&this.lastUndoKey===key&&now-this.lastUndo<900){this.lastUndo=now;return;}this.undoStack.push({p:C.clone(this.p),scene:this.sceneId,node:this.nodeId});if(this.undoStack.length>60)this.undoStack.shift();this.redoStack=[];this.lastUndo=now;this.lastUndoKey=key;}
 changed(render=true){this.p.updatedAt=Date.now();this.saved=false;this.status('等待保存');clearTimeout(this.saveTimer);this.saveTimer=setTimeout(()=>this.persist(),700);if(render)this.render();else this.updateUndo();}
 async persist(){clearTimeout(this.saveTimer);const p=C.clone(this.p);const stamp=p.updatedAt;this.saving=true;this.status('正在保存');try{await this.store.save(p);if(this.p.id===p.id&&this.p.updatedAt===stamp){this.saved=true;this.status('已自动保存');}return true;}catch(err){this.status('保存失败 · 请导出备份');if(!this.saveWarned){this.toast('浏览器保存失败，请立即备份项目：'+err.message,'error');this.saveWarned=true;}return false;}finally{this.saving=false;}}
 status(text){const el=$('#save-status');if(el){el.textContent=text;el.classList.toggle('unsaved',!this.saved);}}
 toast(text,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=text;$('#toasts').append(el);setTimeout(()=>el.remove(),type==='error'?9000:3600);}
 render(){if(!this.scene())return;$('#app').innerHTML=`<header class="app-header"><div class="brand"><span class="brand-symbol">☾</span><div>Moonlit <span>STUDIO</span></div></div><button class="project-switch" data-action="projects"><span>${E(this.p.title)}</span><small>⌄</small></button><span id="save-status" class="save-status ${this.saved?'':'unsaved'}">${this.saved?'已自动保存':'等待保存'}</span><div class="header-actions">${mkbtn('↶','undo','icon-button','撤销 · Ctrl+Z')}${mkbtn('↷','redo','icon-button','重做 · Ctrl+Shift+Z')}${mkbtn('备份项目','backup-project','quiet','Ctrl+S')}${mkbtn('导出游戏','export','quiet')}${mkbtn('▶ 试玩','play','primary')}</div></header><div class="workspace"><aside class="scene-sidebar"><div class="sidebar-heading"><span>剧本场景</span>${mkbtn('+','add-scene','icon-button','新建场景')}</div><div class="scene-list">${this.p.scenes.map((s,i)=>`<button class="scene-item ${s.id===this.sceneId?'selected':''}" data-action="scene:${E(s.id)}"><span class="scene-number">${String(i+1).padStart(2,'0')}</span><span class="scene-name">${E(s.name)}<small>${s.nodes.length} 条指令${s.id===this.p.startScene?' · 起点':''}</small></span>${s.nodes.some(n=>n.type==='end')?'<span class="scene-end">◈</span>':''}</button>`).join('')}</div><div class="sidebar-bottom"><div class="project-stats"><span><strong>${this.p.scenes.length}</strong> 场景</span><span><strong>${this.wordCount()}</strong> 字</span><span><strong>${this.p.assets.length}</strong> 素材</span></div>${mkbtn('⌕ 全文查找','search-all','wide quiet')}${mkbtn('＋ 批量导入台词','import-text','wide quiet')}${mkbtn('使用指南 & 快捷键','help','wide quiet')}<span class="version">MOONLIT ENGINE / 1.0.0</span></div></aside><main class="center"><nav class="view-tabs">${[['script','剧情编辑'],['graph','分支流程'],['assets','素材库'],['characters','角色'],['variables','变量'],['settings','作品设置']].map(([id,text])=>mkbtn(text,'view:'+id,this.view===id?'active':'')).join('')}</nav><div id="main-view"></div></main><aside id="inspector" class="inspector"></aside></div><footer class="statusbar"><span>离线工作区 <span class="status-separator">/</span> ${E(this.scene().name)}</span><div>${mkbtn('◇ 检查项目','validate','status-button')}<span>${this.p.scenes.reduce((a,s)=>a+s.nodes.length,0)} 条指令</span><span>Ctrl + Enter 从当前幕试玩</span></div></footer>`;this.renderView();this.renderInspector();this.updateUndo();}
 updateUndo(){const u=$('[data-action="undo"]'),r=$('[data-action="redo"]');if(u)u.disabled=!this.undoStack.length;if(r)r.disabled=!this.redoStack.length;}
 wordCount(){return this.p.scenes.reduce((sum,s)=>sum+s.nodes.reduce((a,n)=>a+(n.text||'').replace(/\s/g,'').length,0),0);}
 renderView(){const v=$('#main-view');v.className='view-'+this.view;if(this.view==='script'){v.innerHTML=`<div class="stage-section"><div class="section-top"><span>画面预览 <small>当前幕的线性预览</small></span><div>${mkbtn('↗ 从本幕试玩','play-scene','text-button')}${mkbtn('场景设置','scene-settings','text-button')}</div></div><div id="editor-stage" class="editor-stage"></div></div><section class="script-section"><header class="script-heading"><h2>${E(this.scene().name)}</h2><div class="script-tools"><input id="global-search" placeholder="筛选本幕台词…" value="${E(this.search)}" aria-label="筛选本幕台词">${mkbtn('＋ 添加指令','add-command','primary compact')}</div></header><div id="script-list" class="script-list"></div><div class="script-footer"><span>拖动排序 · Shift 多选 · 右侧编辑属性</span><span id="selection-count"></span></div></section>`;this.renderStage();this.renderScript();}else if(this.view==='graph')this.renderGraph();else if(this.view==='assets')this.renderAssets();else if(this.view==='characters')this.renderCharacters();else if(this.view==='variables')this.renderVariables();else if(this.view==='settings')this.renderSettings();}
 renderStage(){const el=$('#editor-stage');if(el){el.style.setProperty('--ratio',this.p.settings.aspect==='4/3'?4/3:16/9);el.innerHTML=R.stageHTML(this.p,C.preview(this.p,this.sceneId,this.nodeId),{preview:true});$$('[data-game]',el).forEach(b=>b.removeAttribute('data-game'));}}
 summary(n){if(n.type==='dialogue')return (this.p.characters.find(c=>c.id===n.character)?.name||'未指定角色')+'：'+n.text;if(n.type==='narration')return n.text;if(n.type==='background')return this.p.assets.find(a=>a.id===n.asset)?.name||'纯色背景 '+n.color;if(n.type==='show'||n.type==='hide')return (this.p.characters.find(c=>c.id===n.character)?.name||'请选择角色')+(n.type==='show'?' · '+(this.p.assets.find(a=>a.id===n.asset)?.name||'默认立绘'):'');if(n.type==='choice')return n.text+' · '+n.options.length+' 个选项';if(n.type==='set')return `${n.variable||'未指定变量'} ${n.op} ${n.value}`;if(n.type==='branch')return `${n.condition?.variable||'未设置条件'} ${n.condition?.op||''} ${n.condition?.value??''}`;if(n.type==='jump')return this.p.scenes.find(s=>s.id===n.target)?.name||'请选择目标场景';if(['music','sound','video'].includes(n.type))return this.p.assets.find(a=>a.id===n.asset)?.name||(n.type==='music'?'停止背景音乐':'请选择素材');if(n.type==='wait')return n.duration+' 毫秒';if(n.type==='effect')return ({fade:'淡入',shake:'震动',flash:'闪白',darken:'闪黑'})[n.effect]||n.effect;if(n.type==='end')return n.title;return '';}
 card(n,i){return `<article tabindex="0" draggable="true" data-node="${E(n.id)}" data-action="node:${E(n.id)}" class="node-card ${this.selected.has(n.id)?'selected':''} type-${n.type}"><span class="node-index">${String(i+1).padStart(2,'0')}</span><span class="node-icon">${icons[n.type]}</span><div class="node-copy"><span class="node-type">${C.TYPES[n.type]}</span><p>${E(this.summary(n))}</p></div><div class="node-actions">${mkbtn('⧉','duplicate-node:'+n.id,'tiny','复制指令')}${mkbtn('×','delete-node:'+n.id,'tiny','删除指令')}</div></article>`;}
 renderScript(){const el=$('#script-list');if(!el)return;const matches=this.scene().nodes.map((n,i)=>({n,i})).filter(({n})=>!this.search||this.summary(n).toLowerCase().includes(this.search.toLowerCase()));el.innerHTML=matches.map(({n,i})=>this.card(n,i)).join('')||'<div class="empty-state"><span>还没有指令</span><p>添加一句对话，故事就从这里开始。</p><button data-action="add-command">添加第一条指令</button></div>';$('#selection-count').textContent=this.selected.size+' 条已选';}
 updateNodeCard(n){const p=$(`[data-node="${CSS.escape(n.id)}"] .node-copy p`);if(p)p.textContent=this.summary(n);}
 selectNode(id,e){if(e?.target.closest('.node-actions'))return;const nodes=this.scene().nodes;if(e?.shiftKey){const a=nodes.findIndex(n=>n.id===this.nodeId),b=nodes.findIndex(n=>n.id===id);for(let i=Math.max(0,Math.min(a,b));i<=Math.max(a,b);i++)this.selected.add(nodes[i].id);}else if(e?.ctrlKey||e?.metaKey){if(this.selected.has(id))this.selected.delete(id);else this.selected.add(id);}else this.selected=new Set([id]);this.nodeId=id;this.renderScript();this.renderStage();this.renderInspector();}
 sceneOptions(value,empty='请选择场景'){return opt('',empty,value)+this.p.scenes.map(s=>opt(s.id,s.name,value)).join('');}
 assetOptions(value,kind='image',empty='无 / 使用默认'){return opt('',empty,value)+this.p.assets.filter(a=>a.mime?.startsWith(kind+'/')).map(a=>opt(a.id,a.name,value)).join('');}
 charOptions(value){return opt('','请选择角色',value)+this.p.characters.map(c=>opt(c.id,c.name,value)).join('');}
 varOptions(value){return opt('','请选择变量',value)+this.p.variables.map(v=>opt(v.name,v.name+' · '+v.type,value)).join('');}
 select(key,options){return `<select data-field="${key}">${options}</select>`;}
 conditionFields(c={},prefix='condition'){return `<div class="condition-fields">${field('变量',this.select(prefix+'.variable',this.varOptions(c?.variable)))}<div class="two-fields">${field('比较',this.select(prefix+'.op',C.OPERATORS.map(op=>opt(op,op,c?.op||'==')).join('')))}${field('比较值',inp(prefix+'.value',c?.value??''),'数字 / true / false / 文本')}</div></div>`;}
 renderInspector(){const el=$('#inspector');if(this.view==='characters'){this.characterInspector();return;}if(this.view==='assets'){this.assetInspector();return;}if(this.view!=='script'){el.innerHTML=`<div class="inspector-header"><span>创作概览</span><small>PROJECT</small></div><div class="inspector-body"><h2 class="overview-title">${E(this.p.title)}</h2><p class="muted">${E(this.p.description||'在作品设置中写下这个故事的简介。')}</p><div class="overview-grid"><div><strong>${this.wordCount()}</strong>文字</div><div><strong>${this.p.characters.length}</strong>角色</div><div><strong>${this.p.scenes.flatMap(s=>s.nodes).filter(n=>n.type==='choice').length}</strong>选择</div><div><strong>${this.p.scenes.flatMap(s=>s.nodes).filter(n=>n.type==='end').length}</strong>结局</div></div><div class="tip-card">${this.view==='graph'?'点击场景卡片可以回到编辑器。每条连接都对应实际的跳转或分支。':this.view==='variables'?'变量可以控制好感度、路线和选项是否出现。在文本中使用 {{变量名}} 显示当前值。':'作品设置会一同打包到成品中。'}</div>${mkbtn('检查项目','validate','wide')}${mkbtn('备份项目文件','backup-project','wide quiet')}</div>`;return;}
 const n=this.node();if(!n){el.innerHTML='<div class="inspector-header">指令属性</div><div class="empty-state">选择一条指令开始编辑</div>';return;}let html='';
 if(['dialogue','narration'].includes(n.type)){if(n.type==='dialogue')html+=field('说话角色',this.select('character',this.charOptions(n.character)));html+=field('台词内容',`<textarea data-live="text" rows="7" placeholder="写下这句台词…">${E(n.text)}</textarea>`,'使用 {{变量名}} 插入动态文本；支持换行。');if(n.type==='dialogue')html+=field('配音',this.select('voice',this.assetOptions(n.voice,'audio','无配音')));}
 if(n.type==='background')html+=field('背景图片',this.select('asset',this.assetOptions(n.asset,'image','纯色背景')))+field('背景颜色',inp('color',n.color,'color'))+field('转场',this.select('transition',opt('fade','淡入',n.transition)+opt('none','立即切换',n.transition)));
 if(['show','hide'].includes(n.type))html+=field('角色',this.select('character',this.charOptions(n.character)));
 if(n.type==='show')html+=field('立绘 / 表情',this.select('asset',this.assetOptions(n.asset)))+field('水平位置（%）',inp('position',n.position,'number','min="-50" max="150"'),'0 左边 · 50 中央 · 100 右边。可直接拖动画面中的立绘。')+field('高度（%）',inp('scale',n.scale,'number','min="10" max="200"'))+field('不透明度（%）',inp('opacity',n.opacity,'number','min="0" max="100"'))+check('flip',n.flip,'水平翻转');
 if(n.type==='choice'){html+=field('选择提示',area('text',n.text,2));n.options.forEach((o,i)=>{html+=`<section class="option-editor"><div class="option-heading"><strong>选项 ${i+1}</strong>${mkbtn('删除','remove-option:'+i,'text-button danger')}</div>${field('选项文字',inp('options.'+i+'.text',o.text))}${field('跳转场景',this.select('options.'+i+'.target',this.sceneOptions(o.target)))}<details ${o.condition?.variable?'open':''}><summary>出现条件（可选）</summary>${this.conditionFields(o.condition||{},'options.'+i+'.condition')}</details></section>`;});html+=mkbtn('＋ 添加选项','add-option','wide');}
 if(n.type==='set')html+=field('变量',this.select('variable',this.varOptions(n.variable)))+field('运算',this.select('op',['=','+=','-=','*='].map(op=>opt(op,{'=':'设为 =','+=':'增加 +=','-=':'减少 -=','*=':'乘以 *='}[op],n.op)).join('')))+field('值',inp('value',n.value),'数字、true / false 或文本。变量需先在“变量”页面定义。');
 if(n.type==='branch')html+=this.conditionFields(n.condition)+field('条件成立 →',this.select('yes',this.sceneOptions(n.yes)))+field('条件不成立 →',this.select('no',this.sceneOptions(n.no)));
 if(n.type==='jump')html+=field('目标场景',this.select('target',this.sceneOptions(n.target)));
 if(['music','sound','video'].includes(n.type))html+=field(n.type==='video'?'视频文件':'音频文件',this.select('asset',this.assetOptions(n.asset,n.type==='video'?'video':'audio',n.type==='music'?'停止背景音乐':'请选择文件')));
 if(['music','sound'].includes(n.type))html+=field('音量（%）',inp('volume',n.volume,'number','min="0" max="100"'));if(n.type==='music')html+=check('loop',n.loop,'循环播放');
 if(n.type==='effect')html+=field('效果',this.select('effect',['fade','shake','flash','darken'].map(x=>opt(x,{fade:'淡入',shake:'震动',flash:'闪白',darken:'闪黑'}[x],n.effect)).join('')));
 if(['wait','effect'].includes(n.type))html+=field('持续时间（毫秒）',inp('duration',n.duration,'number','min="0" max="60000" step="100"'));
 if(n.type==='end')html+=field('结局标题',inp('title',n.title))+field('结局文字',area('text',n.text));
 el.innerHTML=`<div class="inspector-header"><span>指令属性</span><small>${String(this.scene().nodes.indexOf(n)+1).padStart(2,'0')}</small></div><div class="inspector-body"><div class="command-type"><span>${icons[n.type]}</span><strong>${C.TYPES[n.type]}</strong><small>${this.selected.size>1?'已选 '+this.selected.size+' 条':''}</small></div>${html}<hr><div class="row">${mkbtn('↑','move-up','icon-button','上移')}${mkbtn('↓','move-down','icon-button','下移')}${mkbtn('复制','duplicate-selected','quiet')}${mkbtn('删除','delete-selected','danger quiet')}</div><p class="micro">${E(n.id)}</p></div>`;
 }
 changeField(el){const path=el.dataset.field;const prefixes=['project.','scene.','char.','asset.','var.'];let obj=this.node(),keys=path.split('.');if(path.startsWith('project.')){obj=this.p;keys.shift();}else if(path.startsWith('scene.')){obj=this.scene();keys.shift();}else if(path.startsWith('char.')){obj=this.p.characters.find(c=>c.id===this.activeChar);keys.shift();}else if(path.startsWith('asset.')){obj=this.p.assets.find(a=>a.id===this.activeAsset);keys.shift();}else if(path.startsWith('var.')){const i=Number(keys[1]);obj=this.p.variables[i];keys=keys.slice(2);}if(!obj)return;
 let value=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if((keys.at(-1)==='value'&&this.node()?.type==='set'&&!path.startsWith('var.'))||path.includes('.condition.value')||path==='condition.value')value=C.literal(value);if(path.startsWith('var.')&&keys[0]==='value'){value=obj.type==='number'?Number(value):obj.type==='boolean'?value==='true':String(value);}
 if(path==='value'&&this.node()?.type==='set'&&this.p.variables.find(v=>v.name===this.node().variable)?.type==='string')value=el.value;if(typeof value==='number'&&!Number.isFinite(value)){this.toast('请输入有效数字','error');return;}if(el.type==='number'){if(el.min!==''&&value<Number(el.min))value=Number(el.min);if(el.max!==''&&value>Number(el.max))value=Number(el.max);}
 this.checkpoint('field:'+path);let cursor=obj;for(let i=0;i<keys.length-1;i++){if(!cursor[keys[i]])cursor[keys[i]]={};cursor=cursor[keys[i]];}cursor[keys.at(-1)]=value;

 assetInspector(){const a=this.p.assets.find(a=>a.id===this.activeAsset);const el=$('#inspector');if(!a){el.innerHTML='<div class="inspector-header">素材属性</div><div class="inspector-body"><div class="tip-card">图片建议使用 1920×1080 背景和透明 PNG 立绘。配音、BGM 和音效均作为音频导入。<br><br>CG 勾选“加入回忆画廊”后，会在游戏中显示该背景时解锁。</div></div>';return;}const refs=this.assetRefs(a.id);el.innerHTML=`<div class="inspector-header">素材属性</div><div class="inspector-body">${a.mime.startsWith('image/')?`<img class="inspector-image" src="${E(R.safeAsset(this.p,a.id))}" alt="${E(a.name)}">`:a.mime.startsWith('audio/')?`<audio controls class="asset-player" src="${E(R.safeAsset(this.p,a.id))}"></audio>`:`<video controls class="asset-player" src="${E(R.safeAsset(this.p,a.id))}"></video>`}${field('素材名称',inp('asset.name',a.name))}${a.mime.startsWith('image/')?check('asset.gallery',a.gallery,'加入回忆画廊（背景显示时解锁）'):''}<dl class="meta-list"><dt>格式</dt><dd>${E(a.mime)}</dd><dt>大小</dt><dd>${this.formatSize(a.size||0)}</dd><dt>引用次数</dt><dd>${refs}</dd>${a.width?`<dt>分辨率</dt><dd>${a.width} × ${a.height}</dd>`:''}</dl><hr>${mkbtn('替换文件（保留引用）','replace-asset','wide')}${mkbtn('删除素材','delete-asset','danger wide')}<p class="muted">${refs?'删除后相关指令会出现缺失素材提醒。':'这个素材尚未被使用。'}</p></div>`;}

 importAssets(){const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp,image/gif,image/avif,audio/*,video/mp4,video/webm,video/ogg';input.multiple=true;input.onchange=()=>this.addFiles([...input.files]);input.click();}
 async addFiles(files){if(!files.length)return;const additions=[],rejected=[];const projectId=this.p.id;for(const f of files){let mime=f.type;const ext=f.name.split('.').pop().toLowerCase();if(!mime||mime==='application/octet-stream')mime=({mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac',mp4:'video/mp4',webm:'video/webm',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',avif:'image/avif'})[ext]||'';if(!/^(image\/(png|jpeg|webp|gif|avif)|audio\/[\w.+-]+|video\/(mp4|webm|ogg))$/.test(mime)){rejected.push(f.name+'：格式不支持');continue;}if(f.size>40*1024*1024){rejected.push(f.name+'：超过 40 MB');continue;}const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('文件读取失败'));r.readAsDataURL(new Blob([f],{type:mime}));}).catch(()=>null);if(!data){rejected.push(f.name+'：读取失败');continue;}if([...this.p.assets,...additions].some(a=>a.data===data))continue;const a={id:C.uid('asset'),name:f.name,mime,size:f.size,data,gallery:false};if(mime.startsWith('image/')){try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=data;});a.width=img.naturalWidth;a.height=img.naturalHeight;}catch{rejected.push(f.name+'：图片损坏');continue;}}additions.push(a);}
 if(this.p.id!==projectId){this.toast('项目已切换，请在目标项目重新导入素材。','error');return;}if(additions.length){this.checkpoint();this.p.assets.push(...additions);this.activeAsset=additions[0].id;this.view='assets';this.changed();}this.toast('导入 '+additions.length+' 个新素材'+(rejected.length?'；'+rejected.join('；'):''),rejected.length?'error':'');}
 replaceAsset(){const asset=this.p.assets.find(a=>a.id===this.activeAsset);if(!asset)return;const originalId=this.p.id;const input=document.createElement('input');input.type='file';input.accept=asset.mime.split('/')[0]+'/*';input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size>40*1024*1024){this.toast('单个文件最多 40 MB。','error');return;}const kind=asset.mime.split('/')[0];if(!file.type.startsWith(kind+'/')||!/^(image\/(png|jpeg|webp|gif|avif)|audio\/[\w.+-]+|video\/(mp4|webm|ogg))$/.test(file.type)){this.toast('替换文件必须与原素材类型相同，并且格式受支持。','error');return;}try{const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});let width,height;if(kind==='image'){const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=data;});width=img.naturalWidth;height=img.naturalHeight;}if(this.p.id!==originalId)return;this.checkpoint();Object.assign(asset,{data,mime:file.type,size:file.size,name:file.name,width,height});this.changed();this.toast('已替换素材，全部剧情引用保持有效。');}catch{this.toast('无法读取这个文件。','error');}};input.click();}
 deleteAsset(){const a=this.p.assets.find(a=>a.id===this.activeAsset);if(!a)return;const refs=this.assetRefs(a.id);if(!confirm(`删除素材“${a.name}”？${refs?'有 '+refs+' 处引用，需要随后修复。':''}可撤销。`))return;this.checkpoint();this.p.assets=this.p.assets.filter(x=>x.id!==a.id);this.activeAsset=null;this.changed();}
 renderCharacters(){if(!this.activeChar)this.activeChar=this.p.characters[0]?.id;$('#main-view').innerHTML=`<header class="page-heading"><div><span class="eyebrow">CAST & CHARACTERS</span><h2>让角色走进故事</h2><p>角色姓名、台词颜色与默认立绘。</p></div>${mkbtn('＋ 新建角色','add-character','primary')}</header><div class="character-grid">${this.p.characters.map(c=>`<button class="character-card ${this.activeChar===c.id?'selected':''}" data-action="char:${E(c.id)}"><div class="character-portrait">${c.asset&&R.safeAsset(this.p,c.asset)?`<img src="${E(R.safeAsset(this.p,c.asset))}" alt="${E(c.name)}">`:`<span style="color:${/^#[a-f0-9]{6}$/i.test(c.color)?c.color:'#aaa'}">${E(c.name.slice(0,1))}</span>`}</div><div><strong>${E(c.name)}</strong><small>${this.p.scenes.flatMap(s=>s.nodes).filter(n=>n.type==='dialogue'&&n.character===c.id).length} 句台词</small><i style="background:${/^#[a-f0-9]{6}$/i.test(c.color)?c.color:'#aaa'}"></i></div></button>`).join('')||'<div class="empty-state"><h3>还没有角色</h3><p>先为故事添加一个角色。</p><button data-action="add-character">新建角色</button></div>'}</div>`;}
 characterInspector(){const c=this.p.characters.find(c=>c.id===this.activeChar);$('#inspector').innerHTML=`<div class="inspector-header">角色属性</div><div class="inspector-body">${c?`${field('显示姓名',inp('char.name',c.name),'可以使用 {{变量名}} 显示玩家名字。')}${field('姓名颜色',inp('char.color',c.color,'color'))}${field('默认立绘',this.select('char.asset',this.assetOptions(c.asset,'image','不设置立绘')))}<div class="tip-card">不同表情可分别导入图片，再在“显示立绘”指令中覆盖默认图。再次显示同一角色，会替换原有立绘。</div><hr>${mkbtn('删除角色','delete-character','danger wide')}`:'<p class="muted">选择一个角色编辑。</p>'}</div>`;}
 addCharacter(){this.checkpoint();const c={id:C.uid('char'),name:'新角色',color:'#88bccc',asset:''};this.p.characters.push(c);this.activeChar=c.id;this.view='characters';this.changed();}
 deleteCharacter(){const c=this.p.characters.find(c=>c.id===this.activeChar);if(!c)return;const refs=this.p.scenes.flatMap(s=>s.nodes).filter(n=>n.character===c.id).length;if(!confirm(`删除“${c.name}”？${refs?'该角色被 '+refs+' 条指令使用，删除后需重新指定角色。':''}`))return;this.checkpoint();this.p.characters=this.p.characters.filter(x=>x.id!==c.id);this.activeChar=this.p.characters[0]?.id;this.changed();}
 renderVariables(){const rows=this.p.variables.map((v,i)=>`<tr><td><code>${E(v.name)}</code></td><td><select data-field="var.${i}.type">${['number','string','boolean'].map(t=>opt(t,{number:'数字',string:'文本',boolean:'布尔'}[t],v.type)).join('')}</select></td><td>${v.type==='boolean'?`<select data-field="var.${i}.value">${opt('true','true / 是',String(v.value))}${opt('false','false / 否',String(v.value))}</select>`:inp('var.'+i+'.value',v.value,v.type==='number'?'number':'text')}</td><td>${mkbtn('删除','delete-var:'+i,'text-button danger')}</td></tr>`).join('');$('#main-view').innerHTML=`<header class="page-heading"><div><span class="eyebrow">VARIABLES & CONDITIONS</span><h2>故事背后的规则</h2><p>为好感度、路线状态、名字和物品建立变量。</p></div>${mkbtn('＋ 新建变量','add-variable','primary')}</header><div class="content-pad"><table class="variables-table"><thead><tr><th>变量名称</th><th>类型</th><th>初始值</th><th></th></tr></thead><tbody>${rows}</tbody></table>${this.p.variables.length?'':'<div class="empty-state">还没有变量。纯线性故事也可以不使用变量。</div>'}<div class="row spaced">${mkbtn('重命名变量','rename-variable','quiet')}</div><div class="tip-card"><strong>怎么使用？</strong><p>用“变量赋值”指令增加或减少数值；用“条件判断”指令决定下一幕；在选项里设置“出现条件”。</p><p>例如：<code>好感度 += 1</code>，再判断 <code>好感度 &gt;= 3</code>。文本中写 <code>{{好感度}}</code> 可以显示当前数值。</p><p>重命名会同步更新指令和文本引用。变量类型修改后，请检查已有赋值。</p></div></div>`;}
 deleteVariable(i){const v=this.p.variables[i];if(!confirm('删除变量“'+v.name+'”？相关指令需要重新设置。'))return;this.checkpoint();this.p.variables.splice(i,1);this.changed();}
 renameVariable(){if(!this.p.variables.length)return;this.modal('重命名变量',`${field('原变量',`<select id="rename-old">${this.p.variables.map(v=>opt(v.name,v.name,'')).join('')}</select>`)}${field('新名称','<input id="rename-new" placeholder="例如：林间好感度">')}<button class="primary" id="rename-confirm">重命名并更新引用</button>`);$('#rename-confirm').onclick=()=>{const old=$('#rename-old').value,name=$('#rename-new').value.trim();if(!/^[A-Za-z_\u4e00-\u9fff][\w\u4e00-\u9fff]*$/.test(name)||['__proto__','constructor','prototype'].includes(name)||this.p.variables.some(v=>v.name===name)){this.toast('名称不合法或已存在。','error');return;}this.checkpoint();this.p.variables.find(v=>v.name===old).name=name;const updateCondition=c=>{if(c?.variable===old)c.variable=name;};for(const s of this.p.scenes)for(const n of s.nodes){if(n.variable===old)n.variable=name;updateCondition(n.condition);if(n.type==='choice')n.options.forEach(o=>{updateCondition(o.condition);o.text=o.text.split('{{'+old+'}}').join('{{'+name+'}}');});for(const k of ['text','title'])if(n[k])n[k]=n[k].split('{{'+old+'}}').join('{{'+name+'}}');}for(const c of this.p.characters)c.name=c.name.split('{{'+old+'}}').join('{{'+name+'}}');this.closeModal();this.changed();};}
 renderSettings(){const p=this.p;$('#main-view').innerHTML=`<header class="page-heading"><div><span class="eyebrow">PROJECT SETTINGS</span><h2>为故事署名</h2><p>标题画面、运行默认值与版本备份。</p></div></header><div class="settings-columns content-pad"><section>${field('作品标题',inp('project.title',p.title))}${field('作者',inp('project.author',p.author))}${field('作品简介',area('project.description',p.description,4))}${field('起始场景',this.select('project.startScene',this.sceneOptions(p.startScene)))}${field('主题色',inp('project.settings.accent',p.settings.accent,'color'))}</section><section>${field('画面比例',this.select('project.settings.aspect',opt('16/9','16:9 宽屏',p.settings.aspect)+opt('4/3','4:3 经典',p.settings.aspect)))}${field('台词字号（基准宽 1000px）',inp('project.settings.fontSize',p.settings.fontSize,'number','min="16" max="40"'))}${field('文字速度（字 / 秒，0 为瞬间显示）',inp('project.settings.textSpeed',p.settings.textSpeed,'number','min="0" max="100"'))}${field('自动阅读停留（毫秒）',inp('project.settings.autoDelay',p.settings.autoDelay,'number','min="500" max="10000" step="100"'))}${check('project.settings.skipUnread',p.settings.skipUnread,'允许快进未读文字')}<hr><h3>恢复与备份</h3><p class="muted">自动保存保留当前进度；手动快照最多保留 8 个版本。跨电脑请使用项目文件。</p><div class="row">${mkbtn('创建快照','create-backup')}${mkbtn('恢复快照','backups')}</div></section></div>`;}
 async projects(){let list=[];try{list=await this.store.list();}catch{}this.modal('项目管理',`<div class="row">${mkbtn('＋ 空白项目','new-project','primary')}${mkbtn('打开项目文件','import-project')}${mkbtn('载入示例副本','demo-project')}</div><div class="project-list">${list.map(p=>`<article><div><strong>${E(p.title)}</strong><small>${p.scenes.length} 个场景 · ${new Date(p.updatedAt).toLocaleString()}${p.id===this.p.id?' · 当前项目':''}</small></div><div>${mkbtn('打开','open-project:'+p.id)}${p.id!==this.p.id?mkbtn('删除','remove-project:'+p.id,'quiet danger'):''}</div></article>`).join('')}</div><div class="tip-card">项目保存在这台电脑的当前浏览器中。清理浏览器数据、切换浏览器或移动编辑器文件可能影响自动保存位置；请定期下载项目备份。</div>`);}
 async switchProject(p){this.p=C.normalize(p);this.sceneId=this.p.startScene;this.nodeId=this.scene()?.nodes[0]?.id;this.selected=new Set(this.nodeId?[this.nodeId]:[]);this.view='script';this.undoStack=[];this.redoStack=[];this.activeChar=this.activeAsset=null;this.closeModal();this.changed();await this.persist();}
 async openProject(id){if(!await this.persist()&&!confirm('当前项目尚未成功保存。确定继续切换？建议先取消并导出备份。'))return;try{const list=await this.store.list();const p=list.find(p=>p.id===id);if(p)await this.switchProject(p);}catch(e){this.toast(e.message,'error');}}
 async removeProject(id){if(!confirm('删除这个项目及其快照？此操作不能撤销。'))return;try{await this.store.remove(id);await this.projects();}catch(e){this.toast(e.message,'error');}}
 async newProject(demo=false){if(!await this.persist()&&!confirm('自动保存不可用，切换会丢失当前未导出的修改。继续？'))return;const p=demo?C.demo():C.emptyProject();p.id=C.uid('project');if(demo)p.title+='（示例副本）';await this.switchProject(p);if(!demo){this.view='settings';this.render();}}
 importProject(){const input=document.createElement('input');input.type='file';input.accept='.json,.galproject';input.onchange=async()=>{const f=input.files[0];if(!f)return;try{if(f.size>300*1024*1024)throw Error('项目超过 300 MB，请减少素材后重试');const p=C.normalize(JSON.parse(await f.text()));if(!await this.persist()&&!confirm('当前修改尚未保存，仍要打开项目文件？'))return;let copied=false;try{const existing=(await this.store.list()).find(x=>x.id===p.id);if(existing){if(confirm('浏览器中已有同一个项目。确定：备份当前版本后，用文件内容替换；取消：作为独立副本打开。'))await this.store.backup(existing);else{p.id=C.uid('project');copied=true;}}}catch{if(!confirm('无法保存恢复快照。确定继续打开文件？'))return;}await this.switchProject(p);const issues=C.validate(p);this.toast((copied?'项目已作为独立副本打开。':'项目已打开，保留原作品标识。')+(issues.length?'发现 '+issues.length+' 条检查提示，可点击“检查项目”。':''));}catch(err){this.toast('导入失败：'+err.message,'error');}};input.click();}
 async createBackup(){try{await this.store.backup(this.p);this.toast('快照已创建，最多保留最近 8 个。');}catch(e){this.toast('快照失败：'+e.message,'error');}}
 async backups(){try{const list=await this.store.backups(this.p.id);this.modal('恢复项目快照',`<p class="muted">恢复前会先保存当前版本为快照。素材包含在快照中。</p><div class="project-list">${list.map(b=>`<article><div><strong>${new Date(b.time).toLocaleString()}</strong><small>${b.project.scenes.length} 个场景 · ${E(b.project.title)}</small></div>${mkbtn('恢复','restore:'+b.id)}</article>`).join('')||'<p>还没有快照。</p>'}</div>`);}catch(e){this.toast(e.message,'error');}}
 async restoreBackup(id){try{const list=await this.store.backups(this.p.id);const b=list.find(b=>b.id===id);if(!b||!confirm('恢复到选中的快照？当前版本会先创建一个快照。'))return;await this.store.backup(this.p);this.checkpoint();this.p=C.normalize(b.project);this.sceneId=this.p.startScene;this.nodeId=this.scene().nodes[0]?.id;this.selected=new Set(this.nodeId?[this.nodeId]:[]);this.closeModal();this.changed();this.toast('已恢复快照。');}catch(e){this.toast(e.message,'error');}}
 importTextDialog(){this.modal('批量导入台词',`<p class="muted">每个非空行生成一条指令。“角色名：台词”会自动识别角色；其他行作为旁白。可用【场景：名称】分幕，顺序连接场景。已有内容会保留。</p><textarea id="text-import" class="import-text" rows="12" placeholder="【场景：王宫清晨】&#10;晨光透过窗帘落在书页上。&#10;奈莉茜：今天的会议推迟半小时。&#10;丽薇雅：那您至少先把早饭吃完。"></textarea><div class="row spaced">${mkbtn('读取 TXT 文件','load-text-file')}${mkbtn('导入到剧本','import-text-confirm','primary')}</div><p class="micro">不使用 AI，也不发送文本到服务器。支持 UTF-8 文本；含分幕标记时会新建场景，未分幕则插入到当前指令后。</p>`);}
 loadTextFile(){const input=document.createElement('input');input.type='file';input.accept='.txt';input.onchange=async()=>{const f=input.files[0];if(f.size>5*1024*1024){this.toast('文本最多 5 MB。','error');return;}$('#text-import').value=await f.text();};input.click();}
 importText(){const txt=$('#text-import').value;if(!txt.trim()){this.toast('请先输入文本。');return;}const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length>20000){this.toast('一次最多导入 20000 行。','error');return;}this.checkpoint();let current=null,hasScenes=false,total=0;const scenes=[],loose=[];for(const line of lines){const heading=line.match(/^【场景[：:]\s*(.+?)】$/);if(heading){hasScenes=true;current={id:C.uid('scene'),name:heading[1],notes:'从文本导入',next:'',nodes:[]};if(scenes.length)scenes.at(-1).next=current.id;scenes.push(current);continue;}let n;const d=line.match(/^([^：:]{1,24})[：:]\s*(.+)$/);if(d){const name=d[1].trim();if(name==='旁白')n={...C.blankNode('narration'),text:d[2]};else{let c=this.p.characters.find(c=>c.name===name);if(!c){c={id:C.uid('char'),name,color:'#91b8c7',asset:''};this.p.characters.push(c);}n={...C.blankNode('dialogue'),character:c.id,text:d[2]};}}else n={...C.blankNode('narration'),text:line};if(current)current.nodes.push(n);else loose.push(n);total++;}
 if(loose.length){const i=this.scene().nodes.findIndex(n=>n.id===this.nodeId);this.scene().nodes.splice(i+1,0,...loose);this.nodeId=loose[0].id;}
 if(hasScenes){this.p.scenes.push(...scenes);this.sceneId=scenes[0].id;this.nodeId=scenes[0].nodes[0]?.id;}this.selected=new Set(this.nodeId?[this.nodeId]:[]);this.view='script';this.closeModal();this.changed();this.toast(`已导入 ${total} 条指令${hasScenes?'、'+scenes.length+' 个场景（可在流程中连接）':''}。`);}
