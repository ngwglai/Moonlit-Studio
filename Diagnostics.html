<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlit 启动自检</title><style>body{max-width:850px;margin:45px auto;padding:0 24px;background:#142030;color:#ccd9e8;font:16px/1.8 "Microsoft YaHei",sans-serif}h1{font-size:30px;color:#d3b787}p{color:#93abc6}ul{list-style:none;padding:0}li{padding:14px 18px;margin:10px 0;border:1px solid #344c66;border-radius:6px}.pass{background:#22383c}.fail{background:#4a2e39;color:#ffd0d0}button,a{padding:10px 18px;background:#d3b787;color:#142030;border:0;border-radius:5px;cursor:pointer;text-decoration:none;font:inherit;display:inline-block;margin:5px}</style><h1>Moonlit Studio · 启动自检</h1><p>在你的电脑上检查离线引擎、项目保存和浏览器格式支持。此页不会读取或修改已有项目。</p><h2 id="summary">正在检查…</h2><ul id="checks"></ul><button id="tone">播放测试提示音</button><a href="Moonlit-Studio.html">打开编辑器</a><script>(function (global) {
  'use strict';
  const clone = x => {if(x?.schemaVersion===1&&Array.isArray(x.assets)){const copy=JSON.parse(JSON.stringify({...x,assets:[]}));copy.assets=x.assets.map(a=>({...a}));return copy;}return JSON.parse(JSON.stringify(x));};
  const uid = (prefix='id') => prefix+'_'+(global.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2));
  const TYPES = {dialogue:'对话',narration:'旁白',background:'背景',show:'显示立绘',hide:'隐藏立绘',choice:'选项分支',set:'变量赋值',branch:'条件判断',jump:'跳转场景',music:'背景音乐',sound:'音效',wait:'等待',effect:'画面效果',video:'播放视频',end:'结局'};
  const OPERATORS = ['==','!=','>','>=','<','<='];
  function literal(s) { if(typeof s!=='string')return s; const t=s.trim(); if(t==='true')return true;if(t==='false')return false;if(/^[-+]?\d+(\.\d+)?$/.test(t))return Number(t);return s; }

  function blankNode(type='dialogue'){
    const n={id:uid('n'),type};
    const fields={dialogue:{character:'',text:'新的对话',voice:''},narration:{text:'新的旁白'},background:{asset:'',color:'#152b43',transition:'fade'},show:{character:'',asset:'',position:50,scale:100,opacity:100,flip:false},hide:{character:''},choice:{text:'你决定……',options:[{text:'选项一',target:'',condition:null},{text:'选项二',target:'',condition:null}]},set:{variable:'',op:'=',value:1},branch:{condition:{variable:'',op:'>=',value:1},yes:'',no:''},jump:{target:''},music:{asset:'',volume:60,loop:true},sound:{asset:'',volume:80},wait:{duration:1000},effect:{effect:'fade',duration:600},video:{asset:''},end:{title:'故事暂告一段落',text:'感谢你的阅读。'}};

  function emptyProject(){const sid=uid('scene');return {schemaVersion:1,id:uid('project'),title:'未命名作品',author:'',description:'',startScene:sid,settings:{accent:'#d3ae70',textSpeed:32,autoDelay:1800,fontSize:24,aspect:'16/9',skipUnread:false},characters:[],variables:[],assets:[],scenes:[{id:sid,name:'第一幕',notes:'',next:'',nodes:[blankNode('narration'),blankNode('end')]}],updatedAt:Date.now()};}
  function demo(){const p=emptyProject();p.id='moonlit-demo-v1';p.title='雨停之前';p.author='Moonlit Studio';p.description='一封没有署名的来信，两个不同的答案。一个可随意修改的短篇示例。';p.variables=[{name:'trust',type:'number',value:0},{name:'player',type:'string',value:'旅人'}];p.characters=[{id:'lin',name:'林间',color:'#87c5d1',asset:''},{id:'you',name:'{{player}}',color:'#d3ae70',asset:''}];

      {id:'arrival',name:'01 · 雨夜来信',notes:'建立场景 → 对话 → 第一次选择',next:'',nodes:[n('background',{color:'#203b4b'}),n('narration',{text:'雨滴在车站的屋檐下连成一条线。\n最后一班列车已经离开，你却在长椅上发现了一封信。'}),n('dialogue',{character:'lin',text:'你也在等一个不会来的人吗？'}),n('dialogue',{character:'you',text:'我只是……不太想回去。'}),n('dialogue',{character:'lin',text:'那就陪我等到雨停吧。也许这封信，正好是写给你的。'}),n('choice',{text:'她把信递了过来。',options:[{text:'接过信，听听她的故事',target:'letter',condition:null},{text:'把伞递给她，一起离开车站',target:'umbrella',condition:null}]})]},

      {id:'after',name:'04 · 雨停之前',notes:'示例：根据变量选择结局',next:'',nodes:[n('narration',{text:'远处传来了第一班晨车的鸣笛。\n你们之间的信任，悄悄变成了 {{trust}}。'}),n('branch',{condition:{variable:'trust',op:'>=',value:2},yes:'dawn',no:'road'})]},
      {id:'dawn',name:'END A · 下一封信',notes:'信件路线结局',next:'',nodes:[n('background',{color:'#48536a'}),n('dialogue',{character:'lin',text:'下次见面的时候，换你写一封信给我吧。'}),n('end',{title:'下一封信',text:'有些相遇，从一个愿意倾听的人开始。'})]},
      {id:'road',name:'END B · 并肩而行',notes:'雨伞路线结局',next:'',nodes:[n('background',{color:'#415a55'}),n('dialogue',{character:'lin',text:'雨好像停了。……不过，再走一会儿也可以。'}),n('end',{title:'并肩而行',text:'有些答案，就藏在一起走过的路上。'})]}
    ];return p;}
  function normalize(raw){
    if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('项目必须是 JSON 对象');

    p.title=String(p.title||'未命名作品');p.author=String(p.author||'');p.description=String(p.description||'');
    for(const key of ['assets','characters','variables']){if(p[key]===undefined)p[key]=[];if(!Array.isArray(p[key]))throw Error(key+' 必须是列表');}

    for(const a of p.assets){if(!a||!idok(a.id)||typeof a.data!=='string'||typeof a.mime!=='string')throw Error('素材格式错误');a.name=String(a.name||'未命名素材');}
    for(const c of p.characters){if(!c||!idok(c.id))throw Error('角色格式错误');c.name=String(c.name||'未命名角色');c.color=/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#91b8c7';c.asset=String(c.asset||'');}
    for(const v of p.variables){if(!v||typeof v.name!=='string'||!['number','string','boolean'].includes(v.type))throw Error('变量格式错误');}
    if(!idok(p.startScene))throw Error('起始场景 ID 无效');
    for(const sc of p.scenes){if(!sc||!idok(sc.id)||!Array.isArray(sc.nodes)||sc.nodes.length>100000)throw Error('场景缺少有效 id 或 nodes');sc.name=String(sc.name||'未命名场景');sc.notes=String(sc.notes||'');sc.next=String(sc.next||'');
      for(let i=0;i<sc.nodes.length;i++){const n=sc.nodes[i];if(!n||!idok(n.id)||!TYPES[n.type])throw Error('指令格式错误或类型未知');sc.nodes[i]=Object.assign(blankNode(n.type),n);const item=sc.nodes[i];for(const key of ['text','title','character','asset','voice','target','yes','no'])if(item[key]!==undefined)item[key]=String(item[key]??'');
        if(item.type==='choice'){if(!Array.isArray(item.options)||item.options.length>1000)throw Error('选项格式错误');for(const o of item.options){if(!o||typeof o.text!=='string'||typeof o.target!=='string')throw Error('选项缺少文字或目标');}}
      }

  }
  function validate(p){const issues=[];const put=(severity,message,scene,node)=>issues.push({severity,message,scene,node});const scenes=new Set(p.scenes.map(s=>s.id)),assets=new Map(p.assets.map(a=>[a.id,a])),characters=new Set(p.characters.map(c=>c.id)),vars=new Set(p.variables.map(v=>v.name));
    if(!scenes.has(p.startScene))put('error','起始场景不存在');const ids=new Set();for(const s of p.scenes){if(ids.has(s.id))put('error','场景 ID 重复：'+s.id,s.id);ids.add(s.id);}const nids=new Set();const cid=new Set();for(const c of p.characters){if(cid.has(c.id))put('error','角色 ID 重复：'+c.id);cid.add(c.id);}const aid=new Set();for(const a of p.assets){if(aid.has(a.id))put('error','素材 ID 重复：'+a.id);aid.add(a.id);if(!/^data:(image\/(png|jpeg|webp|gif|avif)|audio\/[\w.+-]+|video\/(mp4|webm|ogg));base64,/i.test(a.data||''))put('error','素材格式不安全或不受支持：'+a.name);}
    const vnames=new Set();for(const v of p.variables){if(!/^[A-Za-z_\u4e00-\u9fff][\w\u4e00-\u9fff]*$/.test(v.name)||['__proto__','constructor','prototype'].includes(v.name))put('error','变量名称不合法：'+v.name);if(vnames.has(v.name))put('error','变量名重复：'+v.name);vnames.add(v.name);if(!['number','string','boolean'].includes(v.type)||typeof v.value!==v.type)put('error','变量类型与初始值不匹配：'+v.name);}

    const asset=(id,s,n,kind)=>{if(!id)return;const a=assets.get(id);if(!a)put('error','引用素材不存在',s.id,n.id);else if(kind&&!a.mime?.startsWith(kind+'/'))put('error','素材类型错误，需要 '+kind,s.id,n.id);};

      if(n.character&&!characters.has(n.character))put('error','角色不存在',s.id,n.id);if(['show','hide'].includes(n.type)&&!n.character)put('error','请选择角色',s.id,n.id);if(n.type==='show'&&!n.asset&&!p.characters.find(c=>c.id===n.character)?.asset)put('warning','角色尚未设置立绘',s.id,n.id);
      asset(n.asset,s,n,['background','show'].includes(n.type)?'image':['music','sound'].includes(n.type)?'audio':n.type==='video'?'video':null);asset(n.voice,s,n,'audio');
      if(['dialogue','narration'].includes(n.type)&&!n.text?.trim())put('warning','文本为空',s.id,n.id);
      for(const match of (n.text||'').matchAll(/\{\{([\w\u4e00-\u9fff]+)\}\}/g)){if(!vars.has(match[1]))put('warning','文本引用未定义变量：'+match[1],s.id,n.id);}
      if(['sound','video'].includes(n.type)&&!n.asset)put('error','请选择播放素材',s.id,n.id);if(['wait','effect'].includes(n.type)&&(!Number.isFinite(Number(n.duration))||Number(n.duration)<0||Number(n.duration)>60000))put('error','时长应为 0–60000 毫秒',s.id,n.id);
    }}
    const reached=new Set(),pending=[p.startScene];while(pending.length){const id=pending.pop();if(reached.has(id)||!scenes.has(id))continue;reached.add(id);const s=p.scenes.find(s=>s.id===id);for(const n of s.nodes){if(n.type==='choice')n.options.forEach(o=>pending.push(o.target));if(n.type==='branch'){pending.push(n.yes,n.no);}if(n.type==='jump')pending.push(n.target);}if(s.next)pending.push(s.next);}for(const s of p.scenes)if(!reached.has(s.id))put('warning','从起点无法到达此场景',s.id);return issues;
  }
  function fingerprint(p){let h=2166136261;const str=JSON.stringify([p.scenes,p.variables,p.characters,p.startScene,p.assets.map(a=>a.id)]);for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return (h>>>0).toString(36);}
  class Engine{

    reset(scene){const vars=Object.create(null);for(const v of this.project.variables)vars[v.name]=clone(v.value);this.state={scene:scene||this.project.startScene,index:0,vars,background:{asset:'',color:'#162b40',transition:'fade'},actors:[],music:null,dialogue:null,choice:null,ending:null,ended:false};this.backlog=[];this.history=[];this.events=[];this.current=null;return this;}

    set(n){const v=this.project.variables.find(v=>v.name===n.variable);if(!v)throw Error('变量未定义：'+n.variable);const b=v.type==='string'?String(n.value??''):literal(n.value),a=this.state.vars[n.variable];let result;if(n.op==='=')result=b;else{if(typeof a!=='number'||typeof b!=='number')throw Error('运算要求数字变量');if(n.op==='+=')result=a+b;else if(n.op==='-=')result=a-b;else if(n.op==='*=')result=a*b;else throw Error('未知运算符');}if(typeof result!==v.type||(typeof result==='number'&&!Number.isFinite(result)))throw Error('变量值与定义的类型不匹配');this.state.vars[n.variable]=result;}
    advance(){if(this.state.ended||this.state.choice)return this.current;if(this.current){this.history.push(this.snapshot());if(this.history.length>150)this.history.shift();}this.events=[];this.state.dialogue=null;this.current=null;
      for(let steps=0;steps<2000;steps++){const s=this.project.scenes.find(s=>s.id===this.state.scene);if(!s)throw Error('当前场景不存在');if(this.state.index>=s.nodes.length){if(s.next){this.goto(s.next);continue;}this.state.ended=true;this.state.ending={title:'本幕结束',text:'故事到这里暂时告一段落。'};return null;}const n=s.nodes[this.state.index++];
        switch(n.type){case'background':this.state.background={asset:n.asset||'',color:n.color||'#162b40',transition:n.transition||'fade'};if(n.asset)this.events.push({type:'unlock',asset:n.asset});break;

(async function(){
 const results=document.getElementById('checks');let fails=0,total=0;
 const check=async(name,fn)=>{total++;const li=document.createElement('li');try{const detail=await fn();li.className='pass';li.textContent='✓ '+name+(detail?' — '+detail:'');}catch(e){fails++;li.className='fail';li.textContent='✕ '+name+' — '+e.message;}results.append(li);};
 const assert=(x,msg)=>{if(!x)throw Error(msg||'检查不通过');};
 await check('JavaScript 和离线引擎',()=>{assert(typeof GalCore.Engine==='function');return '引擎已加载，不需要网络';});
 await check('示例工程格式',()=>{assert(GalCore.validate(GalCore.demo()).length===0);return '场景、变量、角色与跳转均有效';});
 for(const option of [0,1])await check('示例路线 '+(option+1),()=>{const e=new GalCore.Engine(GalCore.demo());for(let i=0;i<100&&!e.state.ended;i++)e.state.choice?e.choose(option):e.advance();assert(e.state.ended);assert(e.state.scene===(option===0?'dawn':'road'));return e.state.ending.title;});
 await check('分支回退',()=>{const e=new GalCore.Engine(GalCore.demo());while(!e.state.choice)e.advance();e.choose(0);e.rollback();assert(e.state.vars.trust===0&&e.state.choice.options.length===2);return '选项和变量一起恢复';});
 await check('存档序列化',()=>{const p=GalCore.demo(),a=new GalCore.Engine(p);a.advance();const b=new GalCore.Engine(p);b.load(JSON.parse(JSON.stringify(a.save())));assert(JSON.stringify(a.state)===JSON.stringify(b.state));return '读写一致';});
 await check('浏览器存档空间',()=>{const key='moonlit.diagnostics.'+Date.now();localStorage.setItem(key,'test');assert(localStorage.getItem(key)==='test');localStorage.removeItem(key);return '可保存玩家进度';});
 await check('项目自动保存数据库',()=>new Promise((resolve,reject)=>{const request=indexedDB.open('moonlit-diagnostics-'+Date.now(),1);request.onupgradeneeded=()=>request.result.createObjectStore('test');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('test','readwrite');tx.objectStore('test').put({ok:true},'test');tx.onerror=()=>reject(tx.error);tx.oncomplete=()=>{const tx2=db.transaction('test');const r=tx2.objectStore('test').get('test');r.onsuccess=()=>{const ok=r.result?.ok;const name=db.name;db.close();indexedDB.deleteDatabase(name);ok?resolve('可自动保存编辑项目'):reject(Error('读回失败'));};r.onerror=()=>reject(r.error);};};}));
 await check('对话框和文件读取',()=>{assert(typeof document.createElement('dialog').showModal==='function','请使用较新版本的 Chrome / Edge');assert(typeof FileReader==='function');assert(typeof Blob==='function');return '项目和素材导入功能可用';});
 await check('音频格式支持',()=>{const a=new Audio();const types=[['MP3','audio/mpeg'],['WAV','audio/wav'],['OGG','audio/ogg']].filter(([name,mime])=>a.canPlayType(mime));assert(types.length);return types.map(x=>x[0]).join(' / ');});
 await check('视频格式支持',()=>{const a=document.createElement('video');const types=[['MP4','video/mp4'],['WebM','video/webm']].filter(([name,mime])=>a.canPlayType(mime));assert(types.length);return types.map(x=>x[0]).join(' / ');});
 document.getElementById('summary').textContent=`${total-fails} / ${total} 项通过`+(fails?'。请参考下方失败项目；即使自动保存不可用，仍可导出项目文件。':'。可以开始创作。');
 document.getElementById('tone').onclick=()=>{try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=523.25;g.gain.value=.05;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.stop(ctx.currentTime+.45);o.onended=()=>ctx.close();}catch(e){alert(e.message);}};
})();
